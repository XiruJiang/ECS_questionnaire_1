  <style>
    /* 基本の尺度選択肢を縦並びにし、尺度B〜Pは下で回答しやすい配置に上書きする。 */
    #jspsych-content .jspsych-survey-likert-opts {
      display: block;
      width: min(100%, 680px);
      margin: 12px auto 32px;
      padding-left: 2rem;
      box-sizing: border-box;
      list-style: disc;
      font-size: 16px;
      line-height: 1.6;
    }

    #jspsych-content .jspsych-survey-likert-opts::before {
      display: none;
      content: none;
    }

    #jspsych-content .jspsych-survey-likert-opts li {
      display: list-item !important;
      width: 100% !important;
      margin-bottom: 10px;
      padding-left: 4px;
      text-align: left;
    }

    #jspsych-content .jspsych-survey-likert-opts li::marker {
      color: #555;
    }

    #jspsych-content .jspsych-survey-likert-opt-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.6;
      cursor: pointer;
    }

    #jspsych-content .jspsych-survey-likert-opts li input[type="radio"] {
      display: inline-block;
      position: static;
      flex-shrink: 0;
      margin: 0.35em 0 0;
    }

    .survey-back-button {
      margin-right: 12px;
      color: #34495e;
      background: #eef2f6;
      border: 1px solid #aebdca;
    }

    .survey-back-button:hover {
      background: #e1e8ef;
    }

    .survey-back-button:focus-visible {
      outline: 2px solid #4d6f91;
      outline-offset: 2px;
    }

    .likert-progress-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin: 8px 10px;
      padding: 0 12px;
      color: #765224;
      background: #fff7e6;
      border: 1px solid #e3c98d;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
      white-space: nowrap;
    }

    .likert-progress-status.is-complete {
      color: #27634d;
      background: #edf8f2;
      border-color: #9dceb9;
    }

    .answer-validation-popover {
      --popover-arrow-left: 28px;
      position: fixed;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 24px);
      padding: 11px 14px 11px 10px;
      box-sizing: border-box;
      color: #222;
      background: #fff;
      border: 1px solid #929292;
      border-radius: 5px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 22%);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      text-align: left;
    }

    .answer-validation-popover::before,
    .answer-validation-popover::after {
      content: "";
      position: absolute;
      left: var(--popover-arrow-left);
      width: 0;
      height: 0;
      transform: translateX(-50%);
    }

    .answer-validation-popover::before {
      top: -11px;
      border-right: 11px solid transparent;
      border-bottom: 11px solid #929292;
      border-left: 11px solid transparent;
    }

    .answer-validation-popover::after {
      top: -9px;
      border-right: 9px solid transparent;
      border-bottom: 9px solid #fff;
      border-left: 9px solid transparent;
    }

    .answer-validation-popover.is-above::before {
      top: auto;
      bottom: -11px;
      border-top: 11px solid #929292;
      border-bottom: 0;
    }

    .answer-validation-popover.is-above::after {
      top: auto;
      bottom: -9px;
      border-top: 9px solid #fff;
      border-bottom: 0;
    }

    .answer-validation-popover-icon {
      display: inline-flex;
      flex: 0 0 28px;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: #fff;
      background: #ed6700;
      border-radius: 2px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .answer-validation-popover-message {
      min-width: 0;
    }

    @media (max-width: 600px) {
      .answer-validation-popover {
        gap: 8px;
        padding: 10px 12px 10px 9px;
        font-size: 14px;
      }

      .answer-validation-popover-icon {
        flex-basis: 26px;
        width: 26px;
        height: 26px;
        font-size: 18px;
      }
    }

<script>
  // ====================================
  // 1. jsPsychの準備
  // ====================================

  const jsPsych = initJsPsych();


// DataPipeで表示されたExperiment IDに置き換える
const experimentId = "iMAIUYbsFVf3";

// 回答ごとに異なるIDとファイル名を作る
const participantId = crypto.randomUUID();
const filename = `${participantId}.csv`;

// 回答データにも参加者IDを入れる
jsPsych.data.addProperties({
  participant_id: participantId
});

  let consentGiven = false;
  let currentSurveyStep = 0;
  let navigationFinished = false;

  const savedConsentConfirmations = {};
  let savedDemographicsResponse = {};
  const savedLikertResponses = {};

  function buildLatestSurveyCsv() {
    const allRows = jsPsych.data.get().values();
    const latestTrialIndexByKey = {};

    allRows.forEach(function(row) {
      if (row.navigation_key && row.section !== "navigation") {
        latestTrialIndexByKey[row.navigation_key] = row.trial_index;
      }
    });

    return jsPsych.data.get().filterCustom(function(row) {
      if (row.section === "navigation") return false;
      if (!row.navigation_key) return true;

      return row.trial_index === latestTrialIndexByKey[row.navigation_key];
    }).csv();
  }

  function addPreviousButton(onClick) {
    const display = jsPsych.getDisplayElement();
    const nextButton = display.querySelector(".jspsych-btn");

    if (!nextButton) return null;

    const previousButton = document.createElement("button");
    previousButton.type = "button";
    previousButton.className = "jspsych-btn survey-back-button";
    previousButton.textContent = "前へ";
    previousButton.addEventListener("click", onClick);
    nextButton.parentNode.insertBefore(previousButton, nextButton);

    return previousButton;
  }

  function collectHtmlFormResponse(form) {
    const response = {};

    if (!form) return response;

    new FormData(form).forEach(function(value, name) {
      response[name] = value;
    });

    return response;
  }

  function restoreHtmlFormResponse(savedResponse) {
    const display = jsPsych.getDisplayElement();

    display.querySelectorAll("input[name]").forEach(function(input) {
      const savedValue = savedResponse[input.name];

      if (typeof savedValue === "undefined") return;

      if (input.type === "radio" || input.type === "checkbox") {
        input.checked = String(input.value) === String(savedValue);
      } else {
        input.value = savedValue;
      }
    });
  }

  function collectLikertResponse(questions) {
    const display = jsPsych.getDisplayElement();
    const response = {};

    questions.forEach(function(question, index) {
      const selected = display.querySelector(
        `input[name="Q${index}"]:checked`
      );

      response[question.name] = selected
        ? Number(selected.value)
        : null;
    });

    return response;
  }

  function restoreLikertResponse(scale) {
    const savedResponse = savedLikertResponses[scale.data.scale_id];

    if (!savedResponse) return;

    const display = jsPsych.getDisplayElement();

    scale.questions.forEach(function(question, index) {
      const savedNumber = savedResponse[question.name];

      if (savedNumber === "" || savedNumber === null ||
          typeof savedNumber === "undefined") return;

      const option = display.querySelector(
        `input[name="Q${index}"][value="${Number(savedNumber) - 1}"]`
      );

      if (option) option.checked = true;
    });
  }

  let activeAnswerValidationCleanup = null;

  function hideAnswerValidationPopover() {
    const cleanup = activeAnswerValidationCleanup;
    activeAnswerValidationCleanup = null;

    if (cleanup) cleanup();

    document.querySelectorAll(".answer-validation-popover").forEach(function(popover) {
      popover.remove();
    });
  }

  function showAnswerValidationPopover(target) {
    hideAnswerValidationPopover();

    if (!target) return;

    target.scrollIntoView({ block: "center", inline: "nearest" });
    target.focus({ preventScroll: true });

    const popover = document.createElement("div");
    popover.className = "answer-validation-popover";
    popover.setAttribute("role", "alert");
    popover.setAttribute("aria-live", "assertive");
    popover.innerHTML = `
      <span class="answer-validation-popover-icon" aria-hidden="true">!</span>
      <span class="answer-validation-popover-message">
        これらのオプションのうち、いずれかを選択してください。
      </span>
    `;
    document.body.appendChild(popover);

    const positionPopover = function() {
      if (!popover.isConnected || !target.isConnected) return;

      const targetRect = target.getBoundingClientRect();
      const popoverRect = popover.getBoundingClientRect();
      const viewportPadding = 12;
      const verticalGap = 14;
      const targetCenter = targetRect.left + targetRect.width / 2;
      const left = Math.min(
        Math.max(targetCenter - 28, viewportPadding),
        window.innerWidth - popoverRect.width - viewportPadding
      );
      const hasRoomBelow =
        targetRect.bottom + verticalGap + popoverRect.height <=
        window.innerHeight - viewportPadding;
      const top = hasRoomBelow
        ? targetRect.bottom + verticalGap
        : Math.max(
            viewportPadding,
            targetRect.top - popoverRect.height - verticalGap
          );
      const arrowLeft = Math.min(
        Math.max(targetCenter - left, 18),
        popoverRect.width - 18
      );

      popover.classList.toggle("is-above", !hasRoomBelow);
      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
      popover.style.setProperty("--popover-arrow-left", `${arrowLeft}px`);
    };

    const dismissPopover = function(event) {
      if (event && popover.contains(event.target)) return;
      hideAnswerValidationPopover();
    };

    const activationTimer = window.setTimeout(function() {
      document.addEventListener("pointerdown", dismissPopover, true);
    }, 0);

    window.addEventListener("resize", positionPopover);
    window.addEventListener("scroll", positionPopover, true);
    target.addEventListener("change", dismissPopover, { once: true });

    activeAnswerValidationCleanup = function() {
      window.clearTimeout(activationTimer);
      document.removeEventListener("pointerdown", dismissPopover, true);
      window.removeEventListener("resize", positionPopover);
      window.removeEventListener("scroll", positionPopover, true);
      target.removeEventListener("change", dismissPopover);
      popover.remove();
    };

    window.requestAnimationFrame(positionPopover);
  }

  function enableLikertNavigation(scale, stepIndex) {
    const originalOnLoad = scale.on_load;
    const originalOnFinish = scale.on_finish;
    const navigationKey = `scale_${scale.data.scale_id}`;

    scale.data.navigation_key = navigationKey;
    scale.data.navigation_step = stepIndex;

    scale.on_load = function() {
      if (originalOnLoad) originalOnLoad();

      hideAnswerValidationPopover();

      restoreLikertResponse(scale);

      const display = jsPsych.getDisplayElement();
      const nextButton = display.querySelector(".jspsych-btn");

      addPreviousButton(function() {
        jsPsych.finishTrial({
          response: collectLikertResponse(scale.questions),
          navigation_action: "back"
        });
      });

      if (nextButton) {
        const progressStatus = document.createElement("span");
        progressStatus.className = "likert-progress-status";
        progressStatus.setAttribute("role", "status");
        progressStatus.setAttribute("aria-live", "polite");

        nextButton.classList.add("survey-next-button");
        nextButton.parentNode.insertBefore(progressStatus, nextButton);

        const updateLikertProgress = function() {
          const answeredCount = scale.questions.reduce(function(count, question, index) {
            const answered = display.querySelector(
              `input[name="Q${index}"]:checked`
            );
            return count + (answered ? 1 : 0);
          }, 0);
          const totalCount = scale.questions.length;
          const isComplete = answeredCount === totalCount;

          progressStatus.textContent =
            `回答済み：${answeredCount}/${totalCount}項目`;
          progressStatus.classList.toggle("is-complete", isComplete);
        };

        display.querySelectorAll('input[type="radio"]').forEach(function(input) {
          input.addEventListener("change", function() {
            hideAnswerValidationPopover();
            updateLikertProgress();
          });
        });

        nextButton.disabled = false;
        nextButton.removeAttribute("disabled");
        nextButton.setAttribute("aria-disabled", "false");
        nextButton.addEventListener("click", function(event) {
          const unansweredIndex = scale.questions.findIndex(function(question, index) {
            return !display.querySelector(`input[name="Q${index}"]:checked`);
          });

          if (unansweredIndex === -1) return;

          event.preventDefault();
          event.stopImmediatePropagation();

          const firstUnansweredInput = display.querySelector(
            `input[name="Q${unansweredIndex}"]`
          );

          showAnswerValidationPopover(firstUnansweredInput);
        }, true);

        updateLikertProgress();
      }
    };

    scale.on_finish = function(data) {
      if (originalOnFinish) originalOnFinish(data);

      savedLikertResponses[scale.data.scale_id] = {
        ...data.response
      };

      if (data.navigation_action === "back") {
        currentSurveyStep = Math.max(0, stepIndex - 1);
      } else {
        data.navigation_action = "next";
        currentSurveyStep = stepIndex + 1;
      }
    };
  }

  // 実際の提示順を各尺度のデータに記録する
  randomizedScales.forEach(function(scale, index) {
    // すべての尺度項目を必須回答にし、未回答のまま「次へ」進めないようにする。
    scale.questions.forEach(function(question) {
      question.required = true;
    });

    scale.data.scale_position = index + 1;
    enableLikertNavigation(scale, index + 2);
  });

  const saveStepIndex = randomizedScales.length + 2;

// ====================================
// 回答データをDataPipeへ送信する画面
// ====================================

const saveData = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
    <h2>回答の送信</h2>
    <p>回答を送信するには、下のボタンを押してください。</p>
    <p id="save-status" role="status">
      送信が完了するまで、このページを閉じないでください。
    </p>
  `,

  choices: ["回答を送信する"],

  data: {
    section: "navigation",
    navigation_key: "upload",
    navigation_step: saveStepIndex
  },

  // ボタンを押しただけでは次へ進まない
  response_ends_trial: false,

  on_load: function() {
    const display = jsPsych.getDisplayElement();
    const button = display.querySelector(".jspsych-btn");
    const status = display.querySelector("#save-status");

    const previousButton = addPreviousButton(function() {
      jsPsych.finishTrial({
        navigation_action: "back",
        data_saved: false
      });
    });

    // 戻る前の古い回答と画面移動用の記録を除き、最新回答だけをCSVにする。
    const csvData = buildLatestSurveyCsv();

    let sending = false;

    button.addEventListener("click", async function() {
      if (sending) return;

      sending = true;
      button.disabled = true;
      previousButton.disabled = true;
      status.textContent = "送信中です。ページを閉じないでください。";

      try {
        const response = await fetch(
          "https://pipe.jspsych.org/api/data/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              experimentID: experimentId,
              filename: filename,
              data: csvData
            })
          }
        );

        // 201：保存済み
        // 202：DataPipeで受け付け済み、保存先への転送待ち
        if (response.status !== 201 && response.status !== 202) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || `HTTP ${response.status}`);
        }

        // 受け付けを確認できたときだけ、次の画面へ進む
        navigationFinished = true;
        jsPsych.finishTrial({
          section: "data_upload",
          navigation_action: "submit",
          upload_status: response.status
        });

      } catch (error) {
        status.textContent =
          "送信完了を確認できませんでした。ページを閉じず、" +
          "通信環境を確認して再度送信してください。" +
          " エラー：" + error.message;

        sending = false;
        button.disabled = false;
        previousButton.disabled = false;
      }
    });
  },

  on_finish: function(data) {
    if (data.navigation_action === "back") {
      currentSurveyStep = saveStepIndex - 1;
    }
  }
};


  // ====================================
  // 7. 「前へ」「次へ」で移動できる調査部分
  // ====================================

  const navigableTrials = [
    consent,
    demographics,
    ...randomizedScales,
    saveData
  ];

  const surveyNavigation = {
    timeline: navigableTrials.map(function(trial, stepIndex) {
      return {
        timeline: [trial],
        conditional_function: function() {
          return !navigationFinished && currentSurveyStep === stepIndex;
        }
      };
    }),

    loop_function: function() {
      return !navigationFinished;
    }
  };

  // ====================================
  // 8. 最後の画面
  // ====================================

  const ending = {
  type: jsPsychHtmlButtonResponse,

  stimulus: function() {
    if (consentGiven) {
      return `
        <h2>ご協力ありがとうございました</h2>
        <p>回答の送信を受け付けました。</p>
        <p>このページを閉じてください。</p>
      `;
    }

    return `
      <p>参加に同意されなかったため、調査を終了しました。</p>
      <p>このページを閉じてください。</p>
    `;
  },

  choices: []
};

  // ====================================
  // 9. 全体の順番を決める
  // ====================================

  const timeline = [
    surveyNavigation,
    ending
  ];


  // ====================================
  // 10. 調査を開始する
  // ====================================

  jsPsych.run(timeline);

</script>
</body>
</html>
