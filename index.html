<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケート調査</title>

  <!-- ① jsPsych本体 -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>

  <!-- ② 今回使うプラグイン -->
  <!-- 説明文とボタン -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>

  <!-- 基本情報の自由記述 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>

  <!-- 尺度の質問 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>

  <!-- ③ 見た目 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
  >
</head>

<body>
<script>
  // ====================================
  // 1. jsPsychの準備
  // ====================================

  const jsPsych = initJsPsych();

  let consentGiven = false;


  // ====================================
  // 2. 研究の説明と同意
  // ====================================

  const consent = {
    type: jsPsychHtmlButtonResponse,

    stimulus: `
      <h2>研究へのご協力のお願い</h2>
      <p>【練習用】ここに研究の説明文を入れます。</p>
      <p>研究の目的、所要時間、参加の任意性、</p>
      <p>データの取扱い、問い合わせ先などを記載します。</p>
      <p>説明を読み、参加に同意する場合は、</p>
      <p>「同意して進む」を押してください。</p>
    `,

    choices: ["同意して進む", "同意しない"],

    data: {
      section: "consent"
    },

    on_finish: function(data) {
      // 最初のボタンの番号は0
      consentGiven = (data.response === 0);
      data.consented = consentGiven;
    }
  };


  // ====================================
  // 3. 基本情報
  // ====================================

  const demographics = {
    type: jsPsychSurveyText,

    preamble: "<h2>基本情報</h2>",

    questions: [
      {
        prompt: "年齢を入力してください。",
        name: "age",
        required: false
      },
      {
        prompt: "現在の職業を入力してください。",
        name: "occupation",
        required: false
      }
    ],

    button_label: "次へ",

    data: {
      section: "demographics"
    }
  };


  // ====================================
  // 4. 回答の選択肢
  // ====================================

  const labels5 = [
    "まったくあてはまらない",
    "あまりあてはまらない",
    "どちらともいえない",
    "ややあてはまる",
    "とてもあてはまる"
  ];


  // ====================================
  // 5. 各尺度を作る
  // ====================================

  const scaleA = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Aの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Aの項目1",
        name: "A_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Aの項目2",
        name: "A_02",
        labels: labels5,
        required: false
      }
    ],

    // 尺度内の項目順序を変えない
    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "A" }
  };


  const scaleB = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Bの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Bの項目1",
        name: "B_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Bの項目2",
        name: "B_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "B" }
  };


  const scaleC = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Cの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Cの項目1",
        name: "C_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Cの項目2",
        name: "C_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "C" }
  };


  // ====================================
  // 6. 尺度の順番だけをランダム化する
  // ====================================

  const scales = [scaleA, scaleB, scaleC];

  const randomizedScales =
    jsPsych.randomization.shuffle(scales);

  // 実際の提示順を各尺度のデータに記録する
  randomizedScales.forEach(function(scale, index) {
    scale.data.scale_position = index + 1;
  });


  // ====================================
  // 7. 同意した場合に実施する部分
  // ====================================

  const surveyIfConsented = {
    timeline: [
      demographics,
      ...randomizedScales
    ],

    conditional_function: function() {
      return consentGiven;
    }
  };


  // ====================================
  // 8. 最後の画面
  // ====================================

  const ending = {
    type: jsPsychHtmlButtonResponse,

    stimulus: function() {
      if (consentGiven) {
        return `
          <h2>練習用アンケートは終了です</h2>
          <p>この例では回答データは送信・保存されません。</p>
        `;
      }

      return `
        <p>参加に同意されなかったため、調査を終了します。</p>
        <p>このページを閉じてください。</p>
      `;
    },

    choices: []
  };


  // ====================================
  // 9. 全体の順番を決める
  // ====================================

  const timeline = [
    consent,
    surveyIfConsented,
    ending
  ];


  // ====================================
  // 10. 調査を開始する
  // ====================================

  jsPsych.run(timeline);

</script>
</body>
</html>
