<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケート調査</title>

  <!-- ① jsPsych本体 -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>

  <!-- ② 今回使うプラグイン -->
  <!-- 説明文とボタン -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>

  <!-- 基本情報の自由記述 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>

  <!-- 尺度の質問 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>

  <!-- ③ 見た目 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
  >
</head>

<body>
<script>
  // ====================================
  // 1. jsPsychの準備
  // ====================================

  const jsPsych = initJsPsych();

  
// DataPipeで表示されたExperiment IDに置き換える
const experimentId = "iMAIUYbsFVf3";

// 回答ごとに異なるIDとファイル名を作る
const participantId = crypto.randomUUID();
const filename = `${participantId}.csv`;

// 回答データにも参加者IDを入れる
jsPsych.data.addProperties({
  participant_id: participantId
});

  let consentGiven = false;



// ====================================
// 研究の説明・確認事項・同意
// ====================================

const consent = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
    <div style="
      max-width: 850px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.8;
    ">
     <h2 style="text-align: center; font-size: 24px;">
  研究協力のお願い
</h2>

<p style="font-weight: bold;">
  「Emotion Crafting Scale（ECS）日本語版の作成および
  信頼性・妥当性の検討
  ―成人の愛着傾向との関連に着目して―」
</p>

<div style="margin: 24px 0;">
  <p>【ここに研究の説明文を入れてください】</p>

  <p>【説明文は、段落ごとにこのように分けて入力できます】</p>

  <p>【研究目的、所要時間、データの取扱い、謝礼、
  問い合わせ先などの説明を記載します】</p>
</div>

      <hr>

      <h3>説明事項の確認</h3>

      <p>
        上記の説明を読み、各項目の内容を理解したうえで、
        チェックを入れてください。
      </p>

      <div id="consent-checklist">
        ${[
          "本研究の概要と目的",

          "本人の自由意思による参加であること",

          "本調査の対象者が、日本語で質問内容を理解し回答できる18歳以上の成人であること",

          "本調査は無記名のオンラインアンケート調査であり、回答者と回答データを結び付ける情報が収集されないため、回答送信後は該当する回答データを特定できず、同意の撤回および回答データの削除には対応できないこと",

          "回答送信前であれば、調査画面を閉じることでいつでも参加を中止でき、中止した場合にも不利益を受けないこと",

          "個人情報は厳重に管理され、保護されること",

          "本調査への協力に対する謝礼の支払条件について",

          "感情や対人関係、抑うつおよび不安等に関する質問によって、一時的な不快感や心理的負担が生じる可能性があること"
        ].map(function(text, index) {
          return `
            <label style="
              display: flex;
              align-items: flex-start;
              gap: 12px;
              margin-bottom: 18px;
              cursor: pointer;
            ">
              <input
                type="checkbox"
                name="consent_item_${index + 1}"
                style="
                  width: 20px;
                  height: 20px;
                  flex-shrink: 0;
                  margin-top: 5px;
                "
              >
              <span>${text}</span>
            </label>
          `;
        }).join("")}
      </div>

      <p
        id="consent-status"
        role="status"
        style="font-weight: bold;"
      >
        すべての項目を確認すると「本研究への参加に同意する」を押せます。
      </p>
    </div>
  `,

  choices: ["本研究への参加に同意する", "同意しない"],

  data: {
    section: "consent"
  },

  on_load: function() {
    const display = jsPsych.getDisplayElement();

    const checkboxes = display.querySelectorAll(
      '#consent-checklist input[type="checkbox"]'
    );

    // 最初のボタン＝「本研究への参加に同意する」
    const agreeButton = display.querySelector(
      '#jspsych-html-button-response-button-0 button'
    );

    const status = display.querySelector("#consent-status");

    function updateConsentButton() {
      const checkedCount = Array.from(checkboxes).filter(
        function(checkbox) {
          return checkbox.checked;
        }
      ).length;

      const allChecked = checkedCount === checkboxes.length;

      // 全項目にチェックがあるときだけ有効にする
      agreeButton.disabled = !allChecked;

      // ボタンの見た目
      agreeButton.style.opacity = allChecked ? "1" : "0.4";
      agreeButton.style.cursor = allChecked
        ? "pointer"
        : "not-allowed";

      // 各確認項目を回答データに記録する
      const confirmationData = {};

      checkboxes.forEach(function(checkbox, index) {
        confirmationData[`consent_item_${index + 1}`] =
          checkbox.checked;
      });

      Object.assign(consent.data, confirmationData);

      status.textContent = allChecked
        ? "すべての項目を確認しました。本調査への参加に同意いただける方は、「本研究への参加に同意する」を押して回答画面へお進みください。本調査への参加に同意いただけない場合は、そのまま画面を閉じて調査を終了してください。なお、参加に同意されないことによって、不利益を受けることはありません。"
        : `確認済み：${checkedCount}／${checkboxes.length}項目。すべての項目にチェックを入れてください。`;
    }

    // 最初はチェックがないため、同意ボタンを無効にする
    updateConsentButton();

    // チェックを付ける・外すたびに状態を更新する
    checkboxes.forEach(function(checkbox) {
      checkbox.addEventListener("change", updateConsentButton);
    });
  },

  on_finish: function(data) {
    consentGiven = (data.response === 0);
    data.consented = consentGiven;
  }
};
// ====================================
// 3. 基本情報
// ====================================

const demographics = {
  type: jsPsychSurveyHtmlForm,

  preamble: `
    <h2>基本情報</h2>
    <p>
      年齢を入力し、各質問についてあてはまるものを
      1つずつ選んでください。
    </p>
  `,

  html: `
    <style>
      #demographics-form {
        max-width: 850px;
        margin: 0 auto;
        text-align: left;
        line-height: 1.8;
      }

      #demographics-form fieldset {
        margin: 0 0 24px;
        padding: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      #demographics-form legend {
        padding: 0 8px;
        font-weight: bold;
      }

      #demographics-form .options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 20px;
      }

      #demographics-form .options label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        cursor: pointer;
      }

      #demographics-form input[type="number"] {
        width: 100px;
        padding: 6px;
        font-size: 18px;
      }

      @media (max-width: 600px) {
        #demographics-form .options {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <div id="demographics-form">

      <!-- 年齢 -->
      <fieldset>
        <legend>1．年齢</legend>

        <label>
          <input
            type="number"
            name="age"
            min="18"
            step="1"
            required
          >
          歳
        </label>

        <p style="font-size: 14px; margin-bottom: 0;">
          本調査の対象は18歳以上の方です。
        </p>
      </fieldset>

      <!-- 性別 -->
      <fieldset>
        <legend>2．性別</legend>

        <div class="options">
          ${[
            "男性",
            "女性",
            "その他",
            "回答しない"
          ].map(function(option) {
            return `
              <label>
                <input
                  type="radio"
                  name="gender"
                  value="${option}"
                  required
                >
                <span>${option}</span>
              </label>
            `;
          }).join("")}
        </div>
      </fieldset>

      <!-- 最終学歴 -->
      <fieldset>
        <legend>
          3．あなたの最終学歴（中退含む）は何ですか。
        </legend>

        <div class="options">
          ${[
            "中学・高校",
            "専修・高専・短大",
            "四年制大学",
            "大学院",
            "その他",
            "回答しない"
          ].map(function(option) {
            return `
              <label>
                <input
                  type="radio"
                  name="education"
                  value="${option}"
                  required
                >
                <span>${option}</span>
              </label>
            `;
          }).join("")}
        </div>
      </fieldset>

      <!-- 婚姻状況 -->
      <fieldset>
        <legend>
          4．あなたの婚姻状況をお知らせください。
        </legend>

        <div class="options">
          ${[
            "既婚／同居中",
            "独身",
            "交際相手がいる",
            "別居／離婚",
            "死別",
            "回答しない"
          ].map(function(option) {
            return `
              <label>
                <input
                  type="radio"
                  name="marital_status"
                  value="${option}"
                  required
                >
                <span>${option}</span>
              </label>
            `;
          }).join("")}
        </div>
      </fieldset>

      <!-- 収入 -->
      <fieldset>
        <legend>
          5．昨年のあなたの収入に最も近いのは、
          次のうちどれですか。
        </legend>

        <div class="options">
          ${[
            "100万円未満",
            "100～200万円未満",
            "200～300万円未満",
            "300～400万円未満",
            "400～500万円未満",
            "500～600万円未満",
            "600～700万円未満",
            "700～800万円未満",
            "800～900万円未満",
            "900～1000万円未満",
            "1000万円以上",
            "回答しない"
          ].map(function(option) {
            return `
              <label>
                <input
                  type="radio"
                  name="income"
                  value="${option}"
                  required
                >
                <span>${option}</span>
              </label>
            `;
          }).join("")}
        </div>
      </fieldset>

    </div>
  `,

  button_label: "次へ",

  data: {
    section: "demographics"
  }
};
  // ====================================
  // 4. 回答の選択肢
  // ====================================

  const labels5 = [
    "まったくあてはまらない",
    "あまりあてはまらない",
    "どちらともいえない",
    "ややあてはまる",
    "とてもあてはまる"
  ];


  // ====================================
  // 5. 各尺度を作る
  // ====================================

  const scaleA = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Aの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Aの項目1",
        name: "A_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Aの項目2",
        name: "A_02",
        labels: labels5,
        required: false
      }
    ],

    // 尺度内の項目順序を変えない
    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "A" }
  };


  const scaleB = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Bの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Bの項目1",
        name: "B_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Bの項目2",
        name: "B_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "B" }
  };


  const scaleC = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Cの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Cの項目1",
        name: "C_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Cの項目2",
        name: "C_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "C" }
  };


  // ====================================
  // 6. 尺度の順番だけをランダム化する
  // ====================================

  const scales = [scaleA, scaleB, scaleC];

  const randomizedScales =
    jsPsych.randomization.shuffle(scales);

  // 実際の提示順を各尺度のデータに記録する
  randomizedScales.forEach(function(scale, index) {
    scale.data.scale_position = index + 1;
  });

// ====================================
// 回答データをDataPipeへ送信する画面
// ====================================

const saveData = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
    <h2>回答の送信</h2>
    <p>回答を送信するには、下のボタンを押してください。</p>
    <p id="save-status" role="status">
      送信が完了するまで、このページを閉じないでください。
    </p>
  `,

  choices: ["回答を送信する"],

  // ボタンを押しただけでは次へ進まない
  response_ends_trial: false,

  on_load: function() {
    const display = jsPsych.getDisplayElement();
    const button = display.querySelector(".jspsych-btn");
    const status = display.querySelector("#save-status");

    // この時点までの回答をCSVにする
    const csvData = jsPsych.data.get().csv();

    let sending = false;

    button.addEventListener("click", async function() {
      if (sending) return;

      sending = true;
      button.disabled = true;
      status.textContent = "送信中です。ページを閉じないでください。";

      try {
        const response = await fetch(
          "https://pipe.jspsych.org/api/data/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              experimentID: experimentId,
              filename: filename,
              data: csvData
            })
          }
        );

        // 201：保存済み
        // 202：DataPipeで受け付け済み、保存先への転送待ち
        if (response.status !== 201 && response.status !== 202) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || `HTTP ${response.status}`);
        }

        // 受け付けを確認できたときだけ、次の画面へ進む
        jsPsych.finishTrial({
          section: "data_upload",
          upload_status: response.status
        });

      } catch (error) {
        status.textContent =
          "送信完了を確認できませんでした。ページを閉じず、" +
          "通信環境を確認して再度送信してください。" +
          " エラー：" + error.message;

        sending = false;
        button.disabled = false;
      }
    });
  }
};


  // ====================================
  // 7. 同意した場合に実施する部分
  // ====================================


  const surveyIfConsented = {
  timeline: [
    demographics,        // 基本情報
    ...randomizedScales, // ランダムな順番の尺度
    saveData             // 最後に回答を送信
  ],

  conditional_function: function() {
    return consentGiven;
  }
};

  // ====================================
  // 8. 最後の画面
  // ====================================

  const ending = {
  type: jsPsychHtmlButtonResponse,

  stimulus: function() {
    if (consentGiven) {
      return `
        <h2>ご協力ありがとうございました</h2>
        <p>回答の送信を受け付けました。</p>
        <p>このページを閉じてください。</p>
      `;
    }

    return `
      <p>参加に同意されなかったため、調査を終了しました。</p>
      <p>このページを閉じてください。</p>
    `;
  },

  choices: []
};

  // ====================================
  // 9. 全体の順番を決める
  // ====================================

  const timeline = [
    consent,
    surveyIfConsented,
    ending
  ];


  // ====================================
  // 10. 調査を開始する
  // ====================================

  jsPsych.run(timeline);

</script>
</body>
</html>
