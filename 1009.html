<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケート調査</title>

  <!-- ① jsPsych本体 -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>

  <!-- ② 今回使うプラグイン -->
  <!-- 説明文とボタン -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>

  <!-- 基本情報の自由記述 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>

  <!-- 尺度の質問 -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>

  <!-- ③ 見た目 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
  >
</head>

<body>
<script>
  // ====================================
  // 1. jsPsychの準備
  // ====================================

  const jsPsych = initJsPsych();

  
// DataPipeで表示されたExperiment IDに置き換える
const experimentId = "iMAIUYbsFVf3";

// 回答ごとに異なるIDとファイル名を作る
const participantId = crypto.randomUUID();
const filename = `${participantId}.csv`;

// 回答データにも参加者IDを入れる
jsPsych.data.addProperties({
  participant_id: participantId
});

  let consentGiven = false;


  // ====================================
  // 2. 研究の説明と同意
  // ====================================

  const consent = {
    type: jsPsychHtmlButtonResponse,

    stimulus: `
      <h2>研究へのご協力のお願い</h2>
      <p>【練習用】ここに研究の説明文を入れます。</p>
      <p>研究の目的、所要時間、参加の任意性、</p>
      <p>データの取扱い、問い合わせ先などを記載します。</p>
      <p>説明を読み、参加に同意する場合は、</p>
      <p>「同意して進む」を押してください。</p>
    `,

    choices: ["同意して進む", "同意しない"],

    data: {
      section: "consent"
    },

    on_finish: function(data) {
      // 最初のボタンの番号は0
      consentGiven = (data.response === 0);
      data.consented = consentGiven;
    }
  };


  // ====================================
  // 3. 基本情報
  // ====================================

  const demographics = {
    type: jsPsychSurveyText,

    preamble: "<h2>基本情報</h2>",

    questions: [
      {
        prompt: "年齢を入力してください。",
        name: "age",
        required: false
      },
      {
        prompt: "現在の職業を入力してください。",
        name: "occupation",
        required: false
      }
    ],

    button_label: "次へ",

    data: {
      section: "demographics"
    }
  };


  // ====================================
  // 4. 回答の選択肢
  // ====================================

  const labels5 = [
    "まったくあてはまらない",
    "あまりあてはまらない",
    "どちらともいえない",
    "ややあてはまる",
    "とてもあてはまる"
  ];


  // ====================================
  // 5. 各尺度を作る
  // ====================================

  const scaleA = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Aの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Aの項目1",
        name: "A_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Aの項目2",
        name: "A_02",
        labels: labels5,
        required: false
      }
    ],

    // 尺度内の項目順序を変えない
    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "A" }
  };


  const scaleB = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Bの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Bの項目1",
        name: "B_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Bの項目2",
        name: "B_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "B" }
  };


  const scaleC = {
    type: jsPsychSurveyLikert,
    preamble: "<p>尺度Cの教示文をここに入れます。</p>",

    questions: [
      {
        prompt: "尺度Cの項目1",
        name: "C_01",
        labels: labels5,
        required: false
      },
      {
        prompt: "尺度Cの項目2",
        name: "C_02",
        labels: labels5,
        required: false
      }
    ],

    randomize_question_order: false,

    button_label: "次へ",
    data: { section: "scale", scale_id: "C" }
  };


  // ====================================
  // 6. 尺度の順番だけをランダム化する
  // ====================================

  const scales = [scaleA, scaleB, scaleC];

  const randomizedScales =
    jsPsych.randomization.shuffle(scales);

  // 実際の提示順を各尺度のデータに記録する
  randomizedScales.forEach(function(scale, index) {
    scale.data.scale_position = index + 1;
  });

// ====================================
// 回答データをDataPipeへ送信する画面
// ====================================

const saveData = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
    <h2>回答の送信</h2>
    <p>回答を送信するには、下のボタンを押してください。</p>
    <p id="save-status" role="status">
      送信が完了するまで、このページを閉じないでください。
    </p>
  `,

  choices: ["回答を送信する"],

  // ボタンを押しただけでは次へ進まない
  response_ends_trial: false,

  on_load: function() {
    const display = jsPsych.getDisplayElement();
    const button = display.querySelector(".jspsych-btn");
    const status = display.querySelector("#save-status");

    // この時点までの回答をCSVにする
    const csvData = jsPsych.data.get().csv();

    let sending = false;

    button.addEventListener("click", async function() {
      if (sending) return;

      sending = true;
      button.disabled = true;
      status.textContent = "送信中です。ページを閉じないでください。";

      try {
        const response = await fetch(
          "https://pipe.jspsych.org/api/data/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              experimentID: experimentId,
              filename: filename,
              data: csvData
            })
          }
        );

        // 201：保存済み
        // 202：DataPipeで受け付け済み、保存先への転送待ち
        if (response.status !== 201 && response.status !== 202) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || `HTTP ${response.status}`);
        }

        // 受け付けを確認できたときだけ、次の画面へ進む
        jsPsych.finishTrial({
          section: "data_upload",
          upload_status: response.status
        });

      } catch (error) {
        status.textContent =
          "送信完了を確認できませんでした。ページを閉じず、" +
          "通信環境を確認して再度送信してください。" +
          " エラー：" + error.message;

        sending = false;
        button.disabled = false;
      }
    });
  }
};


  // ====================================
  // 7. 同意した場合に実施する部分
  // ====================================


  const surveyIfConsented = {
  timeline: [
    demographics,        // 基本情報
    ...randomizedScales, // ランダムな順番の尺度
    saveData             // 最後に回答を送信
  ],

  conditional_function: function() {
    return consentGiven;
  }
};

  // ====================================
  // 8. 最後の画面
  // ====================================

  const ending = {
  type: jsPsychHtmlButtonResponse,

  stimulus: function() {
    if (consentGiven) {
      return `
        <h2>ご協力ありがとうございました</h2>
        <p>回答の送信を受け付けました。</p>
        <p>このページを閉じてください。</p>
      `;
    }

    return `
      <p>参加に同意されなかったため、調査を終了しました。</p>
      <p>このページを閉じてください。</p>
    `;
  },

  choices: []
};

  // ====================================
  // 9. 全体の順番を決める
  // ====================================

  const timeline = [
    consent,
    surveyIfConsented,
    ending
  ];


  // ====================================
  // 10. 調査を開始する
  // ====================================

  jsPsych.run(timeline);

</script>
</body>
</html>
